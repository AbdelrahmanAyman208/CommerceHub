# ═══════════════════════════════════════════════════════════════════
# CommerceHub — Dev Docker Compose
# Lightweight: single API instance, no PgBouncer, low memory limits
# ═══════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: commerce_hub
      POSTGRES_PASSWORD: commerce_hub_dev
      POSTGRES_DB: commerce_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── API Server ──────────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - server_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://commerce_hub:commerce_hub_dev@postgres:5432/commerce_hub
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-in-production-min16
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production-min16
      CORS_ORIGIN: http://localhost:5173
      UPLOAD_DIR: /app/uploads
    command: >
      sh -c "npm install &&
             npm run migrate &&
             npm run seed &&
             npx nodemon src/index.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 256m

  # ── Worker (BullMQ + Scheduler) ─────────────────────────────────
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    volumes:
      - ./server:/app
      - server_modules:/app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://commerce_hub:commerce_hub_dev@postgres:5432/commerce_hub
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-in-production-min16
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production-min16
    command: >
      sh -c "sleep 15 && node --watch src/worker.js"
    depends_on:
      - api
    mem_limit: 128m

  # ── Client (Vite Dev Server) ────────────────────────────────────
  client:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_modules:/app/node_modules
    command: >
      sh -c "npm install && npm run dev"
    depends_on:
      - api
    mem_limit: 256m

volumes:
  pgdata_dev:
  server_modules:
  client_modules:
